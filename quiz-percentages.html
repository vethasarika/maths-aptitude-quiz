<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Percentages Quiz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Poppins:wght@400;500;600&display=swap">
<style>
:root{--navy:#0b1f4b;--blue:#2f5da8;--tint:#eaf0fb;--line:#cfd9ee;--ok:#0f7a4f;--okbg:#dcf4e8;--bad:#b3243a;--badbg:#fde3e7}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--navy);font-family:Poppins,system-ui,sans-serif;line-height:1.5}
main{max-width:600px;margin:0 auto;padding:0 18px 48px}
.top{background:var(--navy);color:#fff;margin:0 -18px 22px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.top small{opacity:.8;display:block;font-size:12px}
.tm{font-family:"Playfair Display",serif;font-size:26px;font-weight:800}
.tm.low{color:#ffb4c0}
h1,h2{font-family:"Playfair Display",Georgia,serif;font-weight:800;margin:0}
h1{font-size:40px;line-height:1.1;margin:44px 0 12px}
h2{font-size:23px;line-height:1.3;margin:0 0 20px}
p{color:#4a5a80;margin:0 0 18px}
label{display:block;font-weight:600;margin-bottom:6px}
input{width:100%;font:inherit;font-size:17px;padding:13px 14px;border:2px solid var(--line);border-radius:12px;color:var(--navy);margin-bottom:8px}
input:focus{outline:none;border-color:var(--blue)}
.err{color:var(--bad);font-size:14px;min-height:22px;margin-bottom:8px}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.go{background:var(--navy);color:#fff;border:0;border-radius:12px;padding:14px 26px;font-weight:600;font-size:16px}
.ghost{background:#fff;color:var(--navy);border:2px solid var(--navy);border-radius:12px;padding:12px 22px;font-weight:600;font-size:16px}
.rules{background:var(--tint);border-radius:14px;padding:14px 18px;margin:0 0 22px;font-size:15px;color:var(--navy)}
.rules div{padding:2px 0}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:#fff;color:var(--navy);border:2px solid var(--line);border-radius:14px;padding:13px 16px;margin-bottom:10px;font-size:16px}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font-size:14px}
.opt.sel{background:var(--navy);border-color:var(--navy);color:#fff}
.opt.sel b{background:#fff;color:var(--navy)}
.nav{display:flex;justify-content:space-between;margin:18px 0 26px}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pal button{height:40px;border-radius:10px;border:2px solid var(--line);background:#fff;color:var(--navy);font-weight:600}
.pal button.a{background:var(--tint);border-color:var(--blue)}
.pal button.c{background:var(--navy);border-color:var(--navy);color:#fff}
.sub{font-size:13px;color:#4a5a80;margin:0 0 8px}
.card{border:2px solid var(--navy);border-radius:18px;overflow:hidden;margin:24px 0}
.ch{background:var(--navy);color:#fff;padding:18px}
.ch .n{font-family:"Playfair Display",serif;font-size:26px;font-weight:800}
.ch small{opacity:.8}
.big{text-align:center;padding:20px 10px 6px}
.big div{font-family:"Playfair Display",serif;font-size:64px;font-weight:800;line-height:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-top:1px solid var(--line)}
.grid div{background:#fff;padding:12px 16px;font-size:14px;color:#4a5a80}
.grid b{display:block;font-size:20px;color:var(--navy)}
.rv{padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.rv small{color:#4a5a80;display:block;margin-top:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
@media print{.top,.row,.pal{display:none}}
</style>
</head>
<body>
<main id="app"></main>
<script>
var Q=[["What is 20% of 250?", ["40", "50", "60", "75"], 1, "250 x 20/100 = 50."], ["A price of Rs 400 is increased by 15%. New price:", ["Rs 440", "Rs 450", "Rs 460", "Rs 480"], 2, "400 x 1.15 = 460."], ["35 is what percent of 140?", ["20%", "25%", "30%", "35%"], 1, "35/140 = 1/4 = 25%."], ["A salary of Rs 20000 is cut by 10% and then raised by 10%. Final salary:", ["Rs 20000", "Rs 19800", "Rs 19600", "Rs 20200"], 1, "20000 x 0.9 = 18000. 18000 x 1.1 = 19800."], ["A student scores 45% and gets 180 marks. Maximum marks:", ["360", "400", "450", "500"], 1, "180 / 0.45 = 400."], ["A population of 10000 grows 10% each year. After 2 years:", ["12000", "12100", "12200", "12500"], 1, "10000 x 1.1 x 1.1 = 12100."], ["A is 25% more than B. B is what percent less than A?", ["20%", "25%", "15%", "30%"], 0, "B = 4, A = 5. Difference 1/5 = 20%."], ["40% of a number is 120. What is 60% of it?", ["150", "180", "200", "240"], 1, "Number = 300. 60% of 300 = 180."], ["Pass mark is 40%. A student gets 150 and fails by 30 marks. Maximum marks:", ["400", "450", "500", "600"], 1, "Pass marks = 180 = 40%, so total = 450."], ["A price rises 20% and then 25%. Net increase:", ["45%", "50%", "55%", "60%"], 1, "1.2 x 1.25 = 1.5, so 50%."]];
var T=900,st={name:"",i:0,ans:[],t0:0},app=document.getElementById("app"),iv=null;
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function fmt(s){var m=Math.floor(s/60),r=s%60;return (m<10?"0":"")+m+":"+(r<10?"0":"")+r}
function left(){return Math.max(0,T-Math.floor((Date.now()-st.t0)/1000))}
function home(){clearInterval(iv);
app.innerHTML='<h1>Percentages Quiz</h1><p>Aptitude practice test</p><div class="rules"><div>10 questions: Percentages</div><div>Time limit: 15 minutes, quiz submits automatically at 00:00</div><div>1 mark for each correct answer, no negative marking</div><div>You can go back and change answers before submitting</div></div><label for="nm">Your name</label><input id="nm" maxlength="40" placeholder="Enter your full name" autocomplete="name"><div class="err" id="er"></div><button class="go" id="s">Start quiz</button>';
var nm=document.getElementById("nm");
function go(){var v=nm.value.trim();if(v.length<2){document.getElementById("er").textContent="Please enter your name to start.";nm.focus();return}
st={name:v,i:0,ans:[],t0:Date.now()};iv=setInterval(tick,1000);show()}
document.getElementById("s").onclick=go;nm.onkeydown=function(e){if(e.key==="Enter")go()}}
function tick(){var l=left(),e=document.getElementById("tm");if(e){e.textContent=fmt(l);e.className="tm"+(l<=300?" low":"")}if(l<=0)finish(true)}
function show(){var q=Q[st.i],last=st.i===Q.length-1,l=left();
var h='<div class="top"><div><small>Candidate</small>'+esc(st.name)+'</div><div class="tm'+(l<=300?" low":"")+'" id="tm">'+fmt(l)+'</div></div>';
h+='<p class="sub">Question '+(st.i+1)+' of '+Q.length+' &nbsp;|&nbsp; '+"Percentages"+'</p><h2>'+esc(q[0])+'</h2>';
q[1].forEach(function(t,k){h+='<button class="opt'+(st.ans[st.i]===k?' sel':'')+'" data-k="'+k+'"><b>'+"ABCD"[k]+'</b>'+esc(t)+'</button>'});
h+='<div class="nav">'+(st.i>0?'<button class="ghost" id="p">Back</button>':'<span></span>')+'<button class="go" id="x">'+(last?"Submit quiz":"Next")+'</button></div>';
h+='<p class="sub">Jump to question ('+st.ans.filter(function(a){return a!==undefined}).length+' answered)</p><div class="pal">';
Q.forEach(function(_,k){h+='<button data-j="'+k+'" class="'+(k===st.i?"c":st.ans[k]!==undefined?"a":"")+'">'+(k+1)+'</button>'});
h+='</div>';app.innerHTML=h;
document.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){st.ans[st.i]=+b.dataset.k;show()}});
document.querySelectorAll(".pal button").forEach(function(b){b.onclick=function(){st.i=+b.dataset.j;show()}});
if(st.i>0)document.getElementById("p").onclick=function(){st.i--;show()};
document.getElementById("x").onclick=function(){if(last){var u=Q.length-st.ans.filter(function(a){return a!==undefined}).length;if(u&&!confirm(u+" question(s) are unanswered. Submit anyway?"))return;finish(false)}else{st.i++;show()}}}
function finish(auto){clearInterval(iv);var taken=Math.min(T,Math.round((Date.now()-st.t0)/1000)),sc=0,w=0,s=0,s1=0,s2=0;
Q.forEach(function(q,k){var a=st.ans[k];if(a===undefined)s++;else if(a===q[2]){sc++;if(k<13)s1++;else s2++}else w++});
var p=Math.round(sc/Q.length*100),g=p>=80?"Excellent":p>=60?"Good":p>=40?"Average":"Needs more practice",d=new Date().toLocaleString();
var h='<div class="card"><div class="ch"><div class="n">'+esc(st.name)+'</div><small>Percentages Quiz | '+d+(auto?' | Time is up, auto-submitted':'')+'</small></div><div class="big"><div>'+sc+' / '+Q.length+'</div><p>Total marks ('+p+'%) | '+g+'</p></div><div class="grid"><div>Correct<b>'+sc+'</b></div><div>Wrong<b>'+w+'</b></div><div>Skipped<b>'+s+'</b></div><div>Time taken<b>'+fmt(taken)+'</b></div></div></div>';
var msg="Quiz result\nName: "+st.name+"\nMarks: "+sc+"/"+Q.length+" ("+p+"%)\nCorrect: "+sc+", Wrong: "+w+", Skipped: "+s+"\nTime taken: "+fmt(taken);
h+='<div class="row"><a class="go" style="text-decoration:none;display:inline-block" target="_blank" href="https://wa.me/?text='+encodeURIComponent(msg)+'">Send result on WhatsApp</a><button class="ghost" onclick="window.print()">Save / Print</button><button class="ghost" id="r">Try again</button></div><h2 style="margin-top:30px">Answers and solutions</h2>';
Q.forEach(function(q,k){var a=st.ans[k],ok=a===q[2];
h+='<div class="rv"><b style="color:var(--'+(ok?"ok":"bad")+')">'+(ok?"Correct":a===undefined?"Skipped":"Wrong")+'</b> Q'+(k+1)+'. '+esc(q[0])+'<small>'+(ok||a===undefined?'':'Your answer: '+esc(q[1][a])+'<br>')+'Correct answer: '+esc(q[1][q[2]])+'<br>'+esc(q[3])+'</small></div>'});
app.innerHTML=h;window.scrollTo(0,0);document.getElementById("r").onclick=home}
home();
</script>
</body>
</html>
